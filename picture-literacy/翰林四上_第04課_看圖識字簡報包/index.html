if(step===2)out='<h2 id="stepTitle">③ 讀語詞，說一句話</h2>'+c.vocabs.map((v,k)=>'<article class="vocab"><div>'+image(v.image,v.word+'：'+v.sentence)+'</div><div><div class="badge">'+(k===0?'本義語詞':'生活應用')+'</div><div class="word">'+esc(v.word)+'</div>'+audioButton('w'+(k+1),'聽語詞與例句')+'<p>'+esc(v.sentence)+'</p><p class="small">看看圖片，找出例句中的人物、動作或物品。</p></div></article>').join('')+'<p>選一個語詞，說說自己的生活經驗。</p><button id="autoRead">▶ 連續聽這一字</button>';
if(step===3){const target=c.vocabs.find(v=>v.word.includes(c.char)).word;const question='哪個字能填進「'+target.split(c.char).join('□')+'」？';const choices=[index,(index+1)%characters.length,(index+2)%characters.length].sort((a,b)=>characters[a].char.localeCompare(characters[b].char,'zh-TW'));out='<h2 id="stepTitle">④ 試一題，我會了嗎？</h2><p>'+esc(question)+'</p>'+audioButton('char','再聽一次發音')+'<div class="choices" style="margin-top:18px">'+choices.map(i=>'<button data-answer="'+i+'">'+esc(characters[i].char)+'</button>').join('')+'</div><p id="feedback" role="status"></p><button id="finish" class="primary" hidden>'+(index===characters.length-1?'查看學習進度':'學下一個字 →')+'</button>'}
$('content').innerHTML=out;document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>play(b.dataset.audio));document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(b.querySelector('img').getAttribute('src'),b.querySelector('img').alt));if($('original'))$('original').onclick=()=>zoom(c.card,c.char+'完整原字卡');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(+b.dataset.answer===index){done.add(index);save();updateProgress();$('feedback').textContent='答對了！再把「'+c.char+'」寫一遍。';$('finish').hidden=false;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}else{$('feedback').textContent='再試一次！可以重新聽發音，或回前面看看。';b.disabled=true}});if($('finish'))$('finish').onclick=()=>{if(index<characters.length-1)select(index+1);else{stop('這一字已完成，可從上方選字繼續複習。');$('progressText').scrollIntoView({block:'center'})}};if($('autoRead'))$('autoRead').onclick=playSequence;}
function zoom(src,alt){$('zoomImage').src=src;$('zoomImage').alt=alt;$('zoom').showModal()}
async function play(type,chain=false){if(!chain)stop('');const version=generation,c=characters[index],src=type==='char'||type==='meaning'?c.audio[type]:c.vocabs[type==='w1'?0:1].audio;const b=document.querySelector('[data-audio="'+type+'"]');if(b)b.setAttribute('aria-pressed','true');$('status').textContent='正在播放：'+({char:'發音',meaning:'字義',w1:'語詞一',w2:'語詞二'}[type]);player.src=src;player.onerror=()=>{if(version===generation)stop('音檔無法載入，請確認教材資料夾完整，再試一次。')};try{await player.play()}catch(e){if(version===generation)stop('無法播放，請確認音量與耳機，再按一次朗讀。')}}
function playSequence(){stop('');auto=true;const version=generation,sequence=['char','meaning','w1','w2'];let n=0;player.onended=()=>{if(version!==generation)return;n++;if(n<sequence.length)timers.push(setTimeout(()=>{if(version===generation)play(sequence[n],true)},600));else stop('這一字朗讀完畢，換你說說看！')};play('char',true)}player.addEventListener('ended',()=>{document.querySelectorAll('[data-audio]').forEach(b=>b.setAttribute('aria-pressed','false'));if(!auto)$('status').textContent='播放完畢，可以再聽一次。'});
function changeStep(n){stop('');step=n;render();$('stepTitle').tabIndex=-1;$('stepTitle').focus()}
$('start').onclick=()=>select(index);$('home').onclick=()=>{stop('');$('welcome').hidden=false;$('lesson').hidden=true;updateProgress();$('start').focus()};$('stop').onclick=()=>stop();$('prev').onclick=()=>{if(index>0)select(index-1)};$('next').onclick=()=>{if(index<characters.length-1)select(index+1)};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>changeStep(+b.dataset.step));$('backStep').onclick=()=>changeStep(Math.max(0,step-1));$('forwardStep').onclick=()=>changeStep(Math.min(3,step+1));$('closeZoom').onclick=()=>$('zoom').close();$('reset').onclick=()=>{if(confirm('確定清除本課的學習紀錄，換下一位學生嗎？')){stop('');index=0;step=0;done.clear();save();$('lesson').hidden=true;$('welcome').hidden=false;updateProgress();$('start').focus()}};document.addEventListener('keydown',e=>{if($('lesson').hidden||$('zoom').open||['BUTTON','INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'&&index<characters.length-1){e.preventDefault();select(index+1)}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();select(index-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('已暫停，回來後可再按朗讀。')});updateProgress();
</script></body></html>
