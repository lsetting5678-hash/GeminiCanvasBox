<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="category" content="國語文">
  <meta name="description" content="翰林國小國語三下與四上 1-12 課相關延伸成語閱讀與情境填空練習小工具。">
  <meta name="icon" content="📝">
  <meta name="tags" content="成語練習,國語文,三年級,四年級,翰林版">
  <title>翰林國語成語大師 - 三下與四上成語精熟練習</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-amber-50/40 p-3 md:p-6 flex flex-col items-center justify-center transition-colors duration-300">
  
  <div id="app" class="w-full max-w-2xl mx-auto py-2">
    
    <!-- 頂部通用導覽列 (Top Navigation Bar) -->
    <div class="w-full flex items-center justify-between mb-3 px-1">
      <a href="../../index.html" class="inline-flex items-center space-x-1.5 py-1.5 px-3.5 bg-white/90 hover:bg-orange-500 hover:text-white text-gray-700 rounded-full shadow-sm border border-orange-200/80 font-bold text-xs md:text-sm transition-all duration-200 hover:shadow-md active-scale">
        <span>🏠</span>
        <span>回工具箱首頁</span>
      </a>
      <span class="text-xs font-black text-orange-600/80 bg-orange-100/70 px-3 py-1 rounded-full border border-orange-200/50">
        ✨ 翰林版三下 & 四上
      </span>
    </div>

    <!-- 1. 主選單畫面 (Menu View) -->
    <div id="menu-view" class="flex flex-col items-center justify-center space-y-5 text-center w-full animate-fade-in">
      <div class="text-6xl mb-1 animate-bounce">🏆</div>
      <h1 id="menu-title" class="text-3xl md:text-4xl font-extrabold text-orange-600 tracking-wide drop-shadow-sm">
        翰林國語 四上成語練習
      </h1>
      <p id="menu-subtitle" class="text-gray-600 text-sm md:text-base font-bold">
        共收錄 12 課、77 個生字延伸成語精選！
      </p>
      
      <!-- Step 1: 選擇冊次 / 年級 -->
      <div class="bg-white p-5 md:p-6 rounded-3xl shadow-md border-2 border-orange-100/80 w-full max-w-lg">
        <h2 class="text-base md:text-lg font-extrabold text-gray-700 mb-3 text-left border-b border-orange-50 pb-2 flex items-center justify-between">
          <span class="flex items-center">
            <span class="bg-orange-100 text-orange-600 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 font-black">1</span>
            選擇冊次
          </span>
          <span class="text-xs text-orange-500 font-normal">可自由切換年級</span>
        </h2>
        <div class="grid grid-cols-3 gap-2 md:gap-3">
          <button id="btn-sem-4up" class="py-2.5 px-3 md:px-4 rounded-xl font-extrabold text-sm md:text-base transition-all border-2 active-scale bg-orange-500 text-white shadow-md border-orange-500">
            📙 四上國語
          </button>
          <button id="btn-sem-3down" class="py-2.5 px-3 md:px-4 rounded-xl font-extrabold text-sm md:text-base transition-all border-2 active-scale bg-white text-gray-700 border-gray-200 hover:bg-orange-50 hover:text-orange-600">
            📘 三下國語
          </button>
          <button id="btn-sem-all" class="py-2.5 px-2 md:px-3 rounded-xl font-extrabold text-sm md:text-base transition-all border-2 active-scale bg-white text-gray-700 border-gray-200 hover:bg-orange-50 hover:text-orange-600">
            🌟 跨年級挑戰
          </button>
        </div>
      </div>

      <!-- Step 2: 選擇題型 -->
      <div class="bg-white p-5 md:p-6 rounded-3xl shadow-md border-2 border-orange-100/80 w-full max-w-lg">
        <h2 class="text-base md:text-lg font-extrabold text-gray-700 mb-3 text-left border-b border-orange-50 pb-2 flex items-center">
          <span class="bg-orange-100 text-orange-600 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 font-black">2</span>
          選擇題型
        </h2>
        <div class="grid grid-cols-2 gap-3 md:gap-4">
          <button id="btn-mode-meaning" class="p-4 rounded-2xl font-extrabold text-base md:text-lg flex flex-col items-center transition-all border-2 border-blue-500 bg-blue-500 text-white shadow-md active-scale">
            <span class="text-3xl mb-1">📖</span>
            看解釋猜成語
          </button>
          <button id="btn-mode-sentence" class="p-4 rounded-2xl font-extrabold text-base md:text-lg flex flex-col items-center transition-all border border-gray-200 bg-gray-50 text-gray-600 hover:bg-blue-50 hover:text-blue-600 active-scale">
            <span class="text-3xl mb-1">✍️</span>
            情境填空挑戰
          </button>
        </div>
      </div>

      <!-- Step 3: 選擇課次範圍 -->
      <div class="bg-white p-5 md:p-6 rounded-3xl shadow-md border-2 border-orange-100/80 w-full max-w-lg">
        <h2 class="text-base md:text-lg font-extrabold text-gray-700 mb-3 text-left border-b border-orange-50 pb-2 flex items-center justify-between">
          <span class="flex items-center">
            <span class="bg-orange-100 text-orange-600 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 font-black">3</span>
            選擇範圍 (1-12課)
          </span>
          <span id="selected-info" class="text-xs text-orange-600 font-bold">已選 12 課 (共 77 題)</span>
        </h2>
        <div class="grid grid-cols-3 md:grid-cols-4 gap-2 mb-3" id="lesson-selector-grid">
          <!-- Dynamically populated by JS -->
        </div>
        <div class="flex flex-wrap justify-between items-center gap-1.5 pt-2 border-t border-gray-100 px-1">
          <div class="space-x-1">
            <button id="btn-select-all" class="text-xs px-2.5 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold active-scale">全選</button>
            <button id="btn-select-first-half" class="text-xs px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg font-bold active-scale">1~6課</button>
            <button id="btn-select-second-half" class="text-xs px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg font-bold active-scale">7~12課</button>
          </div>
          <button id="btn-select-none" class="text-xs px-2.5 py-1 bg-red-50 hover:bg-red-100 text-red-500 rounded-lg font-bold active-scale">清除</button>
        </div>
      </div>

      <!-- Step 4: 選擇題數 -->
      <div id="qcount-selector-container" class="bg-white p-5 rounded-3xl shadow-md border-2 border-orange-100/80 w-full max-w-lg">
        <h2 class="text-base md:text-lg font-extrabold text-gray-700 mb-3 text-left border-b border-orange-50 pb-2 flex items-center">
          <span class="bg-orange-100 text-orange-600 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-2 font-black">4</span>
          選擇測驗題數
        </h2>
        <div class="grid grid-cols-4 gap-2">
          <button id="btn-qcount-all" class="py-2 px-2 md:px-4 rounded-xl font-bold text-sm bg-orange-500 text-white shadow-md active-scale">全部</button>
          <button id="btn-qcount-10" class="py-2 px-2 md:px-4 rounded-xl font-bold text-sm bg-gray-100 text-gray-600 hover:bg-gray-200 active-scale">10 題</button>
          <button id="btn-qcount-20" class="py-2 px-2 md:px-4 rounded-xl font-bold text-sm bg-gray-100 text-gray-600 hover:bg-gray-200 active-scale">20 題</button>
          <button id="btn-qcount-30" class="py-2 px-2 md:px-4 rounded-xl font-bold text-sm bg-gray-100 text-gray-600 hover:bg-gray-200 active-scale">30 題</button>
        </div>
      </div>

      <!-- 開始測驗按鈕 -->
      <button id="btn-start-game" class="w-full max-w-lg p-4 rounded-3xl shadow-lg transition-all font-bold text-xl md:text-2xl flex justify-center items-center bg-red-500 hover:bg-red-600 text-white hover:scale-105 active-scale animate-pulse-slow">
        🚀 開始測驗
      </button>
    </div>

    <!-- 2. 遊戲中畫面 (Playing View) -->
    <div id="playing-view" class="hidden w-full max-w-2xl mx-auto flex flex-col items-center animate-fade-in">
      
      <!-- 進度與得分欄 -->
      <div class="w-full flex flex-col mb-5 bg-white p-5 rounded-3xl shadow-md border-2 border-orange-100">
        <div class="flex flex-wrap justify-between items-center mb-4 px-1 gap-2">
          <div class="flex items-center space-x-2">
            <span id="playing-badge-semester" class="bg-orange-100 text-orange-700 text-xs font-black px-2.5 py-1 rounded-full">【四上】</span>
            <span id="playing-badge-mode" class="bg-blue-100 text-blue-700 text-xs font-black px-2.5 py-1 rounded-full">📖 看解釋猜成語</span>
          </div>
          <div class="flex items-center space-x-2">
            <button id="btn-exit-game" class="text-xs font-extrabold text-amber-800 hover:text-white bg-amber-100 hover:bg-orange-500 px-3 py-1.5 rounded-full transition-all border border-amber-200 shadow-sm active-scale flex items-center space-x-1">
              <span>📋</span>
              <span>回選單重選</span>
            </button>
            <a href="../../index.html" class="text-xs font-extrabold text-gray-700 hover:text-white bg-gray-100 hover:bg-gray-800 px-3 py-1.5 rounded-full transition-all border border-gray-200 shadow-sm active-scale flex items-center space-x-1">
              <span>🏠</span>
              <span>回首頁</span>
            </a>
          </div>
        </div>

        <div class="flex justify-between items-center mb-2 px-1 text-sm md:text-base font-bold text-gray-600">
          <div>題號：<span id="playing-progress-text" class="text-orange-500 text-lg font-black">1</span> / <span id="playing-total-text">77</span></div>
          <div>得分：<span id="playing-score-text" class="text-green-600 text-lg font-black">0</span> 分</div>
        </div>

        <!-- 小汽車進度條 -->
        <div class="relative w-[calc(100%-48px)] h-4 bg-orange-100 rounded-full mx-auto my-2">
          <!-- 填滿的進度 -->
          <div id="playing-progress-bar" class="absolute left-0 top-0 h-full bg-orange-400 rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
          
          <!-- 移動的小汽車 -->
          <div id="playing-progress-car" class="absolute top-1/2 transform -translate-y-1/2 -translate-x-1/2 transition-all duration-500 ease-out text-3xl z-10 drop-shadow-md animate-car-bounce" style="left: 0%;">
            <div class="transform scale-x-[-1]">🚗</div>
          </div>
          
          <!-- 終點圖案 (家) -->
          <div class="absolute -right-10 top-1/2 transform -translate-y-1/2 text-4xl z-0 drop-shadow-sm">
            🏠
          </div>
        </div>
      </div>

      <!-- 題目區 -->
      <div class="w-full bg-white p-6 md:p-8 rounded-3xl shadow-lg border-b-8 border-orange-200/90 mb-5 min-h-[160px] flex flex-col items-center justify-center text-center relative">
        <div class="w-full flex items-center justify-between mb-2">
          <span id="playing-lesson-tag" class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded-full">
            第 1 課
          </span>
          <button id="btn-speak-question" class="p-2.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-xl rounded-full shadow-sm transition-transform hover:scale-110 active-scale flex items-center justify-center" title="點擊播放語音">
            🔊
          </button>
        </div>
        <h2 id="playing-question-text" class="text-xl md:text-2xl font-black text-gray-800 leading-relaxed px-2 md:px-6 my-2">
          載入中...
        </h2>
      </div>

      <!-- 選項區 -->
      <div id="playing-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 w-full mb-5">
        <!-- Dynamically populated by JS -->
      </div>

      <!-- 詳解卡片區 (作答後顯示) -->
      <div id="explanation-box" class="hidden w-full bg-white p-5 rounded-3xl shadow-md border-2 border-green-200 mb-5 text-left animate-fade-in">
        <div class="flex items-center space-x-2 mb-2">
          <span class="text-xl">💡</span>
          <span id="explanation-idiom" class="text-lg font-extrabold text-orange-600">【成語】</span>
          <span class="text-xs font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded-full">成語重點解析</span>
        </div>
        <p class="text-sm text-gray-700 mb-2 font-bold"><span class="text-gray-500">釋義：</span><span id="explanation-meaning"></span></p>
        <p class="text-sm text-gray-700 font-bold"><span class="text-gray-500">例句：</span><span id="explanation-sentence"></span></p>
      </div>

      <!-- 下一題按鈕 -->
      <button id="btn-next-question" class="hidden w-full max-w-md p-4 rounded-2xl shadow-lg transition-all font-extrabold text-xl bg-orange-500 hover:bg-orange-600 text-white hover:scale-105 active-scale animate-fade-in">
        下一題 ➡️
      </button>
    </div>

    <!-- 3. 結算畫面 (Result View) -->
    <div id="result-view" class="hidden flex flex-col items-center justify-center space-y-6 text-center w-full max-w-xl mx-auto animate-fade-in">
      <div class="text-7xl mb-1 animate-pulse drop-shadow-lg">🏠🚗💨</div>
      
      <h2 class="text-2xl md:text-3xl font-black text-orange-600 bg-white px-8 py-3 rounded-full shadow-md border border-orange-100">
        測驗完成！太棒了！
      </h2>
      
      <div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-2 border-orange-100 w-full">
        <p class="text-base md:text-lg text-gray-600 mb-2 font-bold">您的測驗成績</p>
        <p class="text-5xl md:text-6xl font-black text-orange-500 mb-2">
          <span id="result-score-text">0</span> 
          <span class="text-xl text-gray-400 font-bold">/ <span id="result-total-text">770</span> 分</span>
        </p>
        <p id="result-percentage-text" class="text-sm font-black text-blue-600 mb-4">答對率 0%</p>
        
        <p id="result-feedback-text" class="text-green-700 font-bold text-base md:text-lg px-2 leading-relaxed bg-green-50 p-3 rounded-2xl border border-green-200">
          太厲害了！您是名副其實的成語大師！🏆
        </p>
      </div>

      <!-- 詳細答題檢討清單 -->
      <div class="bg-white p-5 rounded-3xl shadow-lg border-2 border-orange-100 w-full text-left">
        <div class="flex items-center justify-between mb-4 border-b border-gray-100 pb-3">
          <h3 class="text-base font-black text-gray-800 flex items-center">
            <span class="mr-2">📝</span> 答題檢討與成語複習
          </h3>
          <div class="space-x-1 text-xs">
            <button id="btn-filter-all-review" class="px-3 py-1 bg-orange-500 text-white rounded-lg font-bold">全部</button>
            <button id="btn-filter-wrong-review" class="px-3 py-1 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-lg font-bold">只看錯題</button>
          </div>
        </div>
        <div id="review-list-container" class="max-h-80 overflow-y-auto pr-1 space-y-2">
          <!-- Dynamically populated by JS -->
        </div>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 w-full">
        <button id="btn-restart-game" class="p-3.5 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl shadow-md transition-transform hover:scale-105 active-scale font-extrabold text-base">
          🔄 再測驗一次
        </button>
        <button id="btn-back-to-menu" class="p-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl shadow-md transition-transform hover:scale-105 active-scale font-extrabold text-base border border-gray-200">
          📋 回測驗選單
        </button>
        <a href="../../index.html" class="p-3.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-2xl shadow-md transition-transform hover:scale-105 active-scale font-extrabold text-base flex items-center justify-center border border-amber-300">
          🏠 回工具箱首頁
        </a>
      </div>
    </div>
    
  </div>

  <!-- JavaScript App Logic -->
  <script src="app.js"></script>
</body>
</html>
